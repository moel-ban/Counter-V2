
name: Build Number Counter V2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip NumberCounter_V2.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/NumberCounter
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NumberCounter-V2-APK
          path: extracted/NumberCounter/app/build/outputs/apk/debug/app-debug.apk
